name: supply-chain

# Two gates over what ships in the initramfs /init.
#
# cargo-deny checks the dependency closure against RustSec (plus bans, licenses
# and sources). OSV-Scanner checks the same Cargo.lock against the OSV database,
# which is broader than RustSec alone, and — the part cargo-deny cannot do at
# all — scans the published container image, whose Alpine userland ships
# alongside the binary and was previously unscanned.
#
# All three run on every push/PR, and weekly on a schedule so a newly-published
# advisory against an unchanged Cargo.lock or base image is caught even with no
# code change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pin cargo-deny and verify the downloaded prebuilt against its known SHA-256,
  # so this security gate does not itself pull an unpinned third-party action.
  CARGO_DENY_VERSION: "0.19.8"
  CARGO_DENY_SHA256: "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f"

jobs:
  cargo-deny:
    name: cargo-deny (advisories / bans / licenses / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install cargo-deny (pinned, checksum-verified prebuilt)
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o cargo-deny.tar.gz
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz --strip-components=1
          install -m 0755 cargo-deny /usr/local/bin/cargo-deny
          rm -f cargo-deny.tar.gz
          cargo-deny --version

      - name: cargo-deny check
        # --locked: fail if Cargo.lock is stale, so the audited graph is exactly
        # the graph that ships (no silent re-resolution to a different closure).
        run: cargo-deny --locked check --show-stats

  # Dependencies, against the OSV database. On a pull request the scan is diffed
  # against the base branch, so it fails only on a vulnerability the PR
  # introduces; a push reports without blocking; the weekly run fails, which is
  # what catches an advisory published against code nobody touched.
  osv-scan-pr:
    name: OSV-Scanner (pull request diff)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r
        ./

  osv-scan-full:
    name: OSV-Scanner (full)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r
        ./
      # Report on a push; fail on the weekly run.
      fail-on-vuln: ${{ github.event_name == 'schedule' }}

  # The published image. `make image` / the release build the same Dockerfile,
  # and its Alpine userland ships in the initramfs the inspector boots from, so
  # it needs scanning as much as the Rust closure does. OSV-Scanner takes one
  # image per archive, hence the docker save.
  osv-image-scan:
    name: OSV-Scanner (image)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build the image
        run: docker build -t beskar7-inspector:scan .

      - name: Export it for scanning
        run: docker save -o osv-image.tar beskar7-inspector:scan

      - name: Scan the image
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true # exits 1 on findings; the SARIF below is the report
        with:
          scan-args: |-
            scan
            image
            --archive
            osv-image.tar
            --format=json
            --output=osv-image-results.json

      - name: Convert the image scan to SARIF
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --new=osv-image-results.json
            --output=osv-image-results.sarif
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload the image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-image-results.sarif
          category: osv-scanner-image
