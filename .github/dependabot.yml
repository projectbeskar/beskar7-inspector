# Keep the dependency closure and the pinned action set current.
#
# This pairs with the OSV-Scanner jobs in supply-chain.yml: the weekly scan can
# now go red on an advisory published against code nobody touched, and something
# has to propose the bump that clears it. A scanner without an updater just
# produces a red badge nobody can act on quickly.
version: 2

updates:
  # The Rust closure that ships in the initramfs /init. Grouped, because this is
  # a small binary whose dependencies move together more often than not, and a
  # per-crate pull request would drown a repository this size.
  #
  # Majors are excluded: they are a deliberate decision, and cargo-deny's bans
  # and licenses checks are worth re-reading when one lands. Minors and patches
  # still flow, and `cargo-deny --locked` plus fmt/clippy/test gate every one of
  # them, so a bad bump fails in CI rather than reaching the initramfs.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The base images in the Dockerfile, pinned `tag@sha256:…`. When a tag moves to
  # a newer release, Dependabot rewrites the tag and the digest together.
  #
  # Do not rely on it for a tag rebuilt in place. It can catch one — it proposed
  # the rebuilt rust:1.98-alpine3.24 (#51) the day after skipping it for "cooldown
  # period" — but it missed the one that mattered: Alpine rebuilt `alpine:3.24` on
  # 2026-09-17 (3.24.2, openssl 3.5.7-r0 -> 3.5.8-r0, fixing ten open alerts), and
  # its run four days later logged "No update needed for alpine 3.24". The ten
  # alerts stayed open until a manual bump (#50). The OSV-Scanner (image) job in
  # supply-chain.yml is the dependable signal: when it reports base-image CVEs,
  # compare the pinned digest with the registry's instead of waiting for a PR.
  #
  # Keep the pins anyway: a bare tag here would let a rebuilt base change the
  # booted artifact with nothing in the diff to show it.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(images)"

  # Workflow actions, including the commit-pinned ones (OSV-Scanner, cosign,
  # checkout); Dependabot rewrites the pin and its version comment together.
  #
  # Majors are excluded here too: release.yml's artifact and login actions carry
  # the published boot artifacts and image, so a major belongs in a reviewed
  # pass rather than a routine merge.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
